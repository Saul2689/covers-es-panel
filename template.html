    ground:'#09090B', surface:'#131317', raised:'#1A1A20',

<style>
  :root{color-scheme:dark}
  body{background:#09090B;color:#FAFAFA;font-family:Inter,system-ui,sans-serif;margin:0}
  ::selection{background:#7C3AED;color:#fff}
  .scroll-thin{scrollbar-width:thin;scrollbar-color:#2A2A31 transparent}
  .scroll-thin::-webkit-scrollbar{width:6px;height:6px}
  .scroll-thin::-webkit-scrollbar-thumb{background:#2A2A31;border-radius:99px}
  :focus-visible{outline:2px solid #A78BFA;outline-offset:2px;border-radius:6px}
  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  .fade-in{animation:fi .4s ease both}
  @keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  /* Buscador: un filo de 1px por el que gira un destello violeta. El anillo es
     un círculo mayor que la caja; el interior opaco deja ver solo el borde. */
  .brillo{position:relative;padding:1px;overflow:hidden;background:#2A2A31;
          box-shadow:0 0 0 1px rgba(124,58,237,.14);transition:box-shadow .2s ease}
  .brillo::before{content:"";position:absolute;left:50%;top:50%;width:230%;aspect-ratio:1;
    border-radius:50%;transform:translate(-50%,-50%) rotate(0deg);
    background:conic-gradient(from 0deg,
      rgba(124,58,237,0) 0deg, rgba(124,58,237,0) 232deg,
      rgba(124,58,237,.5) 292deg, #C4B5FD 324deg, rgba(124,58,237,.5) 352deg,
      rgba(124,58,237,0) 360deg);
    animation:girar 4.5s linear infinite}
  .brillo>*{position:relative}
  .brillo:focus-within{box-shadow:0 0 0 1px rgba(124,58,237,.45),0 0 26px -6px rgba(124,58,237,.55)}
  @keyframes girar{to{transform:translate(-50%,-50%) rotate(360deg)}}

  /* Secciones plegables: fuera el triangulo del navegador, el chevron gira. */
  summary::-webkit-details-marker{display:none}
  details[open]>summary .chevron{transform:rotate(90deg)}
</style>

<div class="min-h-screen">

        </span>
        <span class="font-display font-semibold tracking-tight text-[15px]">SingIt</span>

                     transition-all duration-200 hover:-translate-y-0.5 hover:shadow-xl hover:shadow-accent/50
                     disabled:cursor-not-allowed disabled:opacity-40 disabled:shadow-none
                     disabled:hover:translate-y-0 disabled:hover:shadow-none"></button>
    </div>
  </header>

  <!-- ══ aviso de cupo + progreso de la actualización ══ -->
  <div class="mx-auto max-w-[1180px] px-4 sm:px-6">
    <p class="pt-2.5 text-right text-[11.5px] leading-relaxed text-zinc-500" id="x-aviso"></p>
    <div id="x-progreso" hidden
         class="mt-3 rounded-2xl border border-accent/25 bg-accent/[0.07] px-4 py-3 backdrop-blur-md">
      <div class="flex items-center justify-between gap-4">
        <span class="text-[12.5px] font-medium text-accentsoft" id="x-progreso-texto"></span>
        <span class="font-mono text-[11.5px] text-zinc-400" id="x-progreso-reloj">0:00</span>
      </div>
      <div class="mt-2.5 h-1 w-full overflow-hidden rounded-full bg-raised">
        <div class="h-full w-0 rounded-full bg-gradient-to-r from-violet-500 to-accentsoft
                    transition-all duration-700" id="x-progreso-relleno"></div>
      </div>
    </div>
  </div>

  <main class="mx-auto max-w-[1180px] px-4 sm:px-6 pb-24">

    <!-- ══ tesis ══ -->
    <section class="pt-10 sm:pt-14 pb-8">
      <div class="inline-flex items-center gap-2 rounded-full border border-accent/30 bg-accent/10 px-3 py-1 mb-6">
        <span class="h-1.5 w-1.5 rounded-full bg-accentsoft"></span>
        <span class="text-[11.5px] font-medium tracking-wide text-accentsoft" id="x-propuesta"></span>

      </div>

    <!-- ══ cifras ══ -->
    <section class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4" id="x-cifras"></section>

    <!-- ══ pestañas ══ -->
    <div class="mt-10 flex flex-col lg:flex-row lg:items-center gap-3">
      <div class="flex flex-wrap gap-1 rounded-2xl border border-line/60 bg-surface p-1 shadow-sm" id="x-tabs" role="tablist"></div>

                          placeholder:text-zinc-500 focus:outline-none">
          </div>
        </div>
        <span class="font-mono text-[12px] text-zinc-500 whitespace-nowrap" id="x-cuenta"></span>
      </div>
    </div>

    <!-- ══ firma: el riel de la línea (solo pestaña Carry) ══ -->
    <section id="x-linea" hidden class="mt-6">
      <div class="rounded-2xl border border-line/60 bg-surface p-6 sm:p-8 shadow-sm">
        <div class="flex items-baseline justify-between gap-4 flex-wrap">

          <span class="font-mono text-[11.5px] text-zinc-500" id="x-linea-sello"></span>

        <div id="x-parada" hidden class="mt-5 flex items-start gap-3 rounded-xl border border-q1/30 bg-q1/5 px-4 py-3">
          <span class="mt-1.5 h-1.5 w-1.5 shrink-0 rounded-full bg-q1"></span>
          <p class="text-[13.5px] text-zinc-300" id="x-parada-txt"></p>
        </div>
        <div class="mt-6 flex h-8 w-full overflow-hidden rounded-xl border border-white/10 bg-raised" id="x-linea-barra"></div>
        <div class="mt-3 flex flex-wrap gap-x-5 gap-y-2" id="x-linea-leyenda"></div>
        <ol class="mt-6 grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-7 gap-2" id="x-rail"></ol>
      </div>
    </section>

    <!-- ══ reparto de notas (solo pestaña calificadas) ══ -->
    <section id="x-calidad" hidden class="mt-6">
      <div class="rounded-2xl border border-line/60 bg-surface p-6 sm:p-8 shadow-sm">
        <h2 class="font-display font-semibold tracking-tight text-[19px] text-zinc-100" id="x-cal-tit"></h2>
        <div class="mt-5 flex h-8 w-full overflow-hidden rounded-xl border border-white/10 bg-raised" id="x-cal-barra"></div>
        <div class="mt-3 flex flex-wrap gap-x-5 gap-y-2" id="x-cal-leyenda"></div>
      </div>
    </section>

    <!-- ══ lista ══ -->
    <div id="x-rejilla" class="mt-6 grid md:grid-cols-[210px_minmax(0,1fr)] gap-5 lg:gap-6">
      <div id="x-indice-caja" class="hidden md:block">
        <nav id="x-indice" class="sticky top-24 rounded-2xl border border-line/60 bg-surface p-4 shadow-sm">
          <h2 class="font-mono text-[10.5px] uppercase tracking-[0.12em] text-zinc-500 px-1" id="x-indice-tit"></h2>
          <ol class="mt-3 max-h-[62vh] overflow-y-auto scroll-thin pr-1" id="x-idx"></ol>
        </nav>
      </div>
      <div id="x-lista" class="min-w-0"></div>
    </div>
  </main>

  <div id="x-toast" class="pointer-events-none fixed left-1/2 -translate-x-1/2 z-50 opacity-0 transition-opacity duration-200
              rounded-xl bg-zinc-100 px-4 py-2 font-mono text-[12px] text-zinc-900 shadow-lg"
       style="bottom:calc(24px + env(safe-area-inset-bottom,0px))" role="status" aria-live="polite"></div>
</div>

<script id="payload" type="application/json">/*__PAYLOAD__*/</script>
<script>
(function(){
  var P=JSON.parse(document.getElementById('payload').textContent);
  var D=P.data, M=P.meta, LIN=M.linea||{cuenta:{},total:0};
  var BASE='https://api.singit.io';
  var QL={1:'Poor',2:'Weak',3:'Acceptable',4:'Good',5:'Excellent'};
  var QC={1:'#E11D48',2:'#F97316',3:'#EAB308',4:'#84CC16',5:'#22C55E'};
  /* Primero lo que se está trabajando (carry, revisión, corrección,
     traducción), luego lo que espera (en cola), luego lo terminado (hecha), y
     al final "sin original": no es un paso de la línea sino un atasco de otro
     trabajo, y se lleva el 94% de las canciones. */
  var PASOS=['carry','revision','correccion','traduccion','cola','hecha','sinorig'];

  var T={
    es:{loc:'es-ES',
      eyebrow:'Covers de CrossClear',
      propuesta:'Barrido del {fecha}',
      h1:'Covers en español',
      tesis:'Quedan {pend} covers por escuchar. {cal} ya tienen nota.',
      rCon:'Con full song', rNo:'Sin audio utilizable', rCal:'Ya calificadas',
      sub:'La página se actualiza sola cada hora, de 9:00 a 18:00 (hora de Madrid). Cada canción abre su ficha en el admin, que es donde se ponen las estrellas.',
      kSin:'Sin calificar', kSinPie:'covers esperando nota',
      kCon:'Con voz', kConPie:'suenan al darle al play',
      kNo:'Sin audio', kNoPie:'karaoke o 0:00',
      kCal:'Calificadas', kCalPie:'ya tienen estrellas',
      tCon:'Con FULL SONG', tSin:'Sin audio utilizable', tLin:'Carry', tCal:'Ya calificadas',
      buscar:'Buscar canción o artista',
      cancion:'canción', canciones:'canciones',
      artistas:'Artistas', pasos:'Pasos',
      nada:'Ninguna canción coincide con la búsqueda.',
      mas:'Ver {n} artistas más',
      oir:'oír', copiado:'trackId copiado',
      suena:'suena', karaoke:'karaoke', cero:'0:00', archivada:'archivada',
      lineaTit:'La línea, paso a paso',
      lineaSub:'{n} canciones en la línea de producción española. El orden de abajo es el que siguen de verdad.',
      lineaSello:'parte del {fecha}',
      paradaTxt:'{n} parada: alguien tiene que mirarla antes de que siga.',
      paradasTxt:'{n} paradas: alguien tiene que mirarlas antes de que sigan.',
      calTit:'Reparto de notas',
      e_sinorig:'Sin original', e_cola:'En cola', e_carry:'Carry', e_traduccion:'Traduciendo',
      e_revision:'En revisión', e_correccion:'Corrigiendo', e_hecha:'Hecha', e_parada:'Parada',
      vuelta:'1 vuelta', vueltas:'{n} vueltas',
      gRate:'Calificadas', gLock:'Calificadas y bloqueadas',
      bloqueada:'bloqueada', desplegar:'Desplegar', plegar:'Plegar',
      btn:'↻ Actualizar ahora',
      quedan:'{n} de {t} actualizaciones manuales disponibles hoy · tarda {tiempo}',
      agotado:'se han gastado las {t} actualizaciones de hoy · vuelve mañana',
      noDisp:'el botón no está disponible ahora mismo',
      noArranca:'no se ha podido lanzar la actualización',
      previa:'El botón no está disponible ahora mismo.',
      previaClic:'El botón no responde ahora mismo; vuelve a intentarlo en un rato.',
      unMin:'un minuto', variosMin:'unos {m} minutos',
      pidiendo:'Pidiendo la actualización…',
      actualizando:'Actualizando los datos…',
      enMarcha:'Hay una actualización en marcha — esta página se recargará al terminar',
      yaCorriendo:'Ya hay una actualización en marcha…',
      listo:'Listo. Cargando los datos nuevos…',
      de:'de'},
    en:{loc:'en-GB',
      eyebrow:'CrossClear covers',
      propuesta:'Swept on {fecha}',
      h1:'Spanish covers',
      tesis:'{pend} covers still need listening to. {cal} are rated.',
      rCon:'With full song', rNo:'No usable audio', rCal:'Already rated',
      sub:'The page refreshes itself every hour, 9:00 to 18:00 Madrid time. Each song opens its card in the admin, which is where the stars are set.',
      kSin:'Unrated', kSinPie:'covers awaiting a rating',
      kCon:'With voice', kConPie:'play when you hit play',
      kNo:'No audio', kNoPie:'karaoke or 0:00',
      kCal:'Rated', kCalPie:'already have stars',
      tCon:'With FULL SONG', tSin:'No usable audio', tLin:'Carry', tCal:'Rated & Locked',
      buscar:'Search song or artist',
      cancion:'song', canciones:'songs',
      artistas:'Artists', pasos:'Steps',
      nada:'No song matches your search.',
      mas:'Show {n} more artists',
      oir:'listen', copiado:'trackId copied',
      suena:'plays', karaoke:'karaoke', cero:'0:00', archivada:'archived',
      lineaTit:'The line, step by step',
      lineaSub:'{n} songs in the Spanish production line. The order below is the one they actually follow.',
      lineaSello:'report from {fecha}',
      paradaTxt:'{n} stopped: someone has to look at it before it moves on.',
      paradasTxt:'{n} stopped: someone has to look at them before they move on.',
      calTit:'How the ratings fall',
      e_sinorig:'No original', e_cola:'Queued', e_carry:'Carry', e_traduccion:'Translating',
      e_revision:'Under review', e_correccion:'Being fixed', e_hecha:'Done', e_parada:'Stopped',
      vuelta:'1 pass', vueltas:'{n} passes',
      gRate:'Rated', gLock:'Rated & locked',
      bloqueada:'locked', desplegar:'Expand', plegar:'Collapse',
      btn:'↻ Refresh now',
      quedan:'{n} of {t} manual refreshes left today · takes {tiempo}',
      agotado:'today’s {t} refreshes are used up · come back tomorrow',
      noDisp:'the button is not available right now',
      noArranca:'the refresh could not be started',
      previa:'The button is not available right now.',
      previaClic:'The button is not responding right now; try again in a little while.',
      unMin:'a minute', variosMin:'about {m} minutes',
      pidiendo:'Requesting the refresh…',
      actualizando:'Refreshing the data…',
      enMarcha:'Someone is already refreshing — this page will reload when it finishes',
      yaCorriendo:'A refresh is already running…',
      listo:'Done. Loading the new data…',
      de:'of'}
  };

  var L='en', nf=new Intl.NumberFormat('en-GB');
  try{ var g=localStorage.getItem('covers-es-idioma'); if(g==='es'||g==='en'){L=g;} }catch(e){}
  function t(k,v){var s=(T[L][k]||k);if(v)for(var a in v)s=s.split('{'+a+'}').join(v[a]);return s;}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function fecha(iso){
    if(!iso) return '';
    var d=new Date(iso.length<=10?iso+'T12:00:00Z':(/[Zz]$/.test(iso)?iso:iso+'Z'));
    if(isNaN(d)) return '';
    return new Intl.DateTimeFormat(T[L].loc,{day:'numeric',month:'short'}).format(d);
  }

  /* ── estado ── */
  var vista='con', q='', tope=40;

  /* ── toast ── */
  var toast=document.getElementById('x-toast'), tt;
  function avisa(msg){
    toast.textContent=msg; toast.style.opacity='1';
    clearTimeout(tt); tt=setTimeout(function(){toast.style.opacity='0';},1800);
  }

  /* ── piezas ── */
  function estrellas(n){
    var o='<span class="inline-flex items-center gap-1.5">';
    o+='<span class="inline-flex gap-px" aria-hidden="true">';
    for(var i=1;i<=5;i++){
      o+='<span class="h-1.5 w-1.5 rounded-full" style="background:'+(i<=n?QC[n]:'#2A2A31')+'"></span>';
    }
    o+='</span><span class="font-mono text-[11px]" style="color:'+QC[n]+'">'+n+'/5 '+QL[n]+'</span></span>';
    return o;
  }
  function chip(txt,tono,extra,sm){
    var c={ok:'border-q5/30 bg-q5/10 text-q5',
           bad:'border-q1/40 bg-q1/10 text-q1',
           warn:'border-q2/30 bg-q2/10 text-q2',
           mute:'border-line/70 bg-raised text-zinc-500',
           accent:'border-accent/30 bg-accent/10 text-accentsoft'}[tono]||'';
    /* sm = la version compacta que usa la columna de estado. Se cambia el
       tamano aqui y no con clases sueltas porque dos utilidades del mismo
       grupo (px-2 y px-1.5) se pisan en un orden que Tailwind decide. */
    var d=sm?'gap-1 rounded-md px-1.5 py-px text-[10px]':'gap-1.5 rounded-lg px-2 py-0.5 text-[11px]';
    return '<span class="inline-flex items-center border font-medium '+d+' '+
      c+' '+(extra||'')+'">'+txt+'</span>';
  }
  function idbtn(id){
    return '<button type="button" data-id="'+id+'" title="'+esc(id)+'" '+
      'class="rounded-lg border border-line/70 bg-raised px-2 py-0.5 font-mono text-[11px] text-zinc-500 '+
      'transition-all duration-200 hover:border-accent/50 hover:text-accentsoft">'+id.slice(-6)+'</button>';
  }
  function titulo(tit,id){
    return '<a href="'+BASE+'/admin/tracks/'+id+'" target="_blank" rel="noopener" '+
      'class="font-medium text-[14.5px] text-zinc-100 transition-colors duration-200 hover:text-accentsoft">'+esc(tit)+'</a>';
  }

  /* Candado: lo echa una persona cuando da la cancion por cerrada. */
  function candado(){
    return '<svg class="h-3 w-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" '+
      'stroke-width="2.4" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"></rect>'+
      '<path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>';
  }

  /* ── filas por vista ── */
  function fila(r){
    var acc='', meta='';
    /* Sin etiqueta de estado en la fila: la seccion en la que esta ya lo dice,
       y repetirlo en cada linea solo quita sitio al titulo. */
    if(vista==='cal'){
      acc=estrellas(r[3])+idbtn(r[2]);
      if(r[4]===1) meta=chip(t('archivada'),'mute');
    }else if(vista==='linea'){
      if(r[5]>0) acc+=chip(r[5]===1?t('vuelta'):t('vueltas',{n:r[5]}),'mute');
      if(r[9]) acc+=estrellas(r[9]);
      acc+=idbtn(r[2]);
      /* El candado cierra la fila, a la derecha del trackId: es lo ultimo que
         le pasa a una cancion y distingue las cerradas del todo. */
      if(r[12]) acc+=chip(candado()+t('bloqueada'),'ok');
      if(r[6]) meta='<span class="font-mono text-[11px] text-zinc-600">'+esc(fechaHora(r[6]))+'</span>';
    }else{
      var suena=r[4]===1;
      acc=chip(suena?t('suena'):(r[6]===1?t('cero'):t('karaoke')), suena?'ok':(r[6]===1?'warn':'mute'));
      acc+=idbtn(r[2]);
      if(suena) acc+='<a href="'+BASE+'/admin/api/cross-clear/migration/songs/'+r[3]+'/audio" target="_blank" rel="noopener" '+
        'class="rounded-lg border border-line/70 bg-raised px-2 py-0.5 text-[11px] font-medium text-zinc-400 '+
        'transition-all duration-200 hover:border-accent/50 hover:text-accentsoft">'+t('oir')+'</a>';
    }
    var motivo = (vista==='linea' && r[7])
      /* El motivo lo escribe el agente en español; si el parte trae ademas la
         version inglesa (indice 11) se usa esa cuando el panel esta en EN. */
      ? '<p class="mt-2 text-[12.5px] leading-relaxed max-w-[80ch]" style="color:#CDB765">'+
        esc((L==='en'&&r[11])?r[11]:r[7])+'</p>' : '';
    return '<div class="group rounded-xl border border-transparent px-3 py-2.5 transition-all duration-200 '+
      'hover:border-line/60 hover:bg-raised">'+
      '<div class="flex flex-wrap items-center gap-x-3 gap-y-2">'+
      '<div class="min-w-0 flex-1 flex flex-wrap items-center gap-x-2.5 gap-y-1">'+titulo(r[0],r[2])+meta+'</div>'+
      '<div class="flex flex-wrap items-center gap-2">'+acc+'</div></div>'+motivo+'</div>';
  }
  function fechaHora(iso){
    var d=new Date(/[Zz]$/.test(iso)?iso:iso+'Z');
    if(isNaN(d)) return '';
    return new Intl.DateTimeFormat(T[L].loc,{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}).format(d);
  }
  function colorPaso(e){
    return {parada:'#E11D48',correccion:'#F97316',revision:'#EAB308',carry:'#7C3AED',
            traduccion:'#84CC16',cola:'#A1A1AA',sinorig:'#52525B',hecha:'#22C55E'}[e]||'#52525B';
  }

  /* ── agrupar ── */
  var abierto={};
  function fuente(){return D[vista]||[];}
  function filtra(){
    var s=q.trim().toLowerCase();
    if(!s) return fuente();
    return fuente().filter(function(r){
      return (r[0]+' '+r[1]).toLowerCase().indexOf(s)>-1;
    });
  }
  function agrupa(filas){
    if(vista==='linea'){
      var orden=['parada'].concat(PASOS), bolsa={};
      orden.forEach(function(e){bolsa[e]=[];});
      filas.forEach(function(r){(bolsa[r[4]]||bolsa.cola).push(r);});
      return orden.filter(function(e){return bolsa[e].length;})
        .map(function(e){return {clave:e,nombre:t('e_'+e),color:colorPaso(e),filas:bolsa[e]};});
    }
    if(vista==='cal'){
      /* Dos bloques: calificada a secas, y calificada + bloqueada (el candado
         lo pone una persona cuando da la canción por cerrada). */
      var sol=[], amb=[];
      filas.forEach(function(r){ (r[5]?amb:sol).push(r); });
      /* De mejor a peor nota: lo bueno arriba, y dentro de cada nota por titulo. */
      var porNota=function(a,b){return (b[3]||0)-(a[3]||0) || a[0].localeCompare(b[0],'es');};
      sol.sort(porNota); amb.sort(porNota);
      return [{clave:'rate',nombre:t('gRate'),color:'#EAB308',filas:sol},
              {clave:'lock',nombre:t('gLock'),color:'#22C55E',filas:amb}]
        .filter(function(g){return g.filas.length;});
    }
    var m=new Map();
    filas.forEach(function(r){ if(!m.has(r[1])) m.set(r[1],[]); m.get(r[1]).push(r); });
    return Array.from(m.entries()).sort(function(a,b){return a[0].localeCompare(b[0],'es');})
      .map(function(p){return {clave:p[0],nombre:p[0],color:null,filas:p[1]};});
  }

  /* ── pintar ── */
  function pinta(){
    var filas=filtra(), grupos=agrupa(filas), lista=document.getElementById('x-lista');
    document.getElementById('x-cuenta').textContent=
      nf.format(filas.length)+' '+(filas.length===1?t('cancion'):t('canciones'));

    if(!grupos.length){
      lista.innerHTML='<div class="rounded-2xl border border-line/60 bg-surface p-8 text-center text-[14px] text-zinc-500">'+t('nada')+'</div>';
      document.getElementById('x-idx').innerHTML='';
      return;
    }
    var muestra=grupos.slice(0,tope);
    /* Carry y calificadas se pliegan: son pocas secciones y muy largas. Los
       artistas no, porque son cientos de bloques de dos o tres canciones. */
    var plegable=(vista==='linea'||vista==='cal');
    lista.innerHTML=muestra.map(function(g,i){
      /* Cada sección se viste de su color: el punto, el nombre y el borde de la
         tarjeta. Los grupos por artista no tienen color y se quedan neutros. */
      var c=g.color;
      var punto=c?'<span class="h-2 w-2 shrink-0 rounded-full" style="background:'+c+'"></span>':'';
      var cab='<span class="font-display font-semibold tracking-tight text-[15px]'+(c?'':' text-zinc-200')+'"'+
              (c?' style="color:'+c+'"':'')+'>'+esc(g.nombre)+'</span>'+
              '<span class="font-mono text-[11.5px] text-zinc-600">'+nf.format(g.filas.length)+'</span>';
      var caja='class="scroll-mt-24 mb-4 rounded-2xl border bg-surface p-4 sm:p-5 shadow-sm '+
               'transition-all duration-200 '+(c?'':'border-line/60 hover:border-line')+'"'+
               (c?' style="border-color:'+c+'59"':'')+'>';
      if(!plegable)
        return '<section id="g'+i+'" data-clave="'+esc(g.clave)+'" '+caja+
          '<h3 class="mb-2 flex items-center gap-2.5 px-1">'+punto+cab+'</h3>'+
          g.filas.map(fila).join('')+'</section>';
      /* Las secciones muy largas arrancan plegadas para que la página no abra
         con dos mil filas de golpe. */
      var abre=abierto[g.clave]!==undefined?abierto[g.clave]:(g.filas.length<=150);
      return '<details id="g'+i+'" data-clave="'+esc(g.clave)+'" '+(abre?'open ':'')+caja+
        '<summary class="-mx-1 flex cursor-pointer list-none items-center gap-2.5 rounded-xl px-1 py-1 '+
        'transition-colors duration-200 hover:bg-raised/60">'+
        '<svg class="chevron h-3.5 w-3.5 shrink-0 transition-transform duration-200" '+
        'style="color:'+(c||'#71717A')+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" '+
        'stroke-width="2.5" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>'+punto+cab+'</summary>'+
        '<div class="mt-2">'+g.filas.map(fila).join('')+'</div></details>';
    }).join('')+(grupos.length>tope
      ? '<button id="x-mas" class="w-full rounded-2xl border border-line/60 bg-surface px-4 py-3.5 text-[13.5px] '+
        'font-medium text-zinc-400 transition-all duration-200 hover:-translate-y-0.5 hover:border-accent/50 '+
        'hover:text-white hover:shadow-lg hover:shadow-accent/10">'+t('mas',{n:nf.format(grupos.length-tope)})+'</button>'
      : '');

    var mas=document.getElementById('x-mas');
    if(mas) mas.addEventListener('click',function(){tope+=40;pinta();});

    document.getElementById('x-idx').innerHTML=muestra.map(function(g,i){
      var punto=g.color?'<span class="h-1.5 w-1.5 shrink-0 rounded-full" style="background:'+g.color+'"></span>':'';
      return '<li><button data-i="'+i+'" class="flex w-full items-center gap-2 rounded-lg px-2 py-1.5 text-left '+
        'text-[12.5px] text-zinc-400 transition-colors duration-200 hover:bg-raised hover:text-zinc-100">'+punto+
        '<span class="truncate">'+esc(g.nombre)+'</span>'+
        '<span class="ml-auto font-mono text-[11px] text-zinc-600">'+g.filas.length+'</span></button></li>';
    }).join('');
  }

  /* ── cabecera, cifras, riel ── */
  function cifras(){
    var c=[['kSin','kSinPie',M.total,'text-zinc-50','rgba(255,255,255,.10)'],
           ['kCon','kConPie',M.con,'text-q5','rgba(34,197,94,.14)'],
           ['kNo','kNoPie',M.sin,'text-zinc-50','rgba(255,255,255,.10)'],
           ['kCal','kCalPie',M.calificadas,'text-accentsoft','rgba(124,58,237,.18)']];
    document.getElementById('x-cifras').innerHTML=c.map(function(x){
      return '<div class="relative overflow-hidden rounded-2xl border border-white/10 '+
        'bg-gradient-to-b from-white/[0.09] via-white/[0.035] to-white/[0.015] p-5 sm:p-6 '+
        'shadow-lg shadow-black/40 backdrop-blur-xl">'+
        '<span class="pointer-events-none absolute inset-x-0 top-0 h-px bg-gradient-to-r from-transparent via-white/45 to-transparent"></span>'+
        '<span class="pointer-events-none absolute -right-8 -top-14 h-28 w-28 rounded-full blur-2xl opacity-80" '+
        'style="background:'+x[4]+'"></span>'+
        '<span class="pointer-events-none absolute inset-0 rounded-2xl ring-1 ring-inset ring-white/[0.06]"></span>'+
        '<div class="relative font-display font-semibold tracking-tight text-[30px] leading-none '+x[3]+'" '+
        'style="font-variant-numeric:tabular-nums">'+nf.format(x[2])+'</div>'+
        '<div class="relative mt-2.5 text-[13px] font-medium text-zinc-200">'+t(x[0])+'</div>'+
        '<div class="relative mt-0.5 text-[12px] text-zinc-400">'+t(x[1])+'</div></div>';
    }).join('');
  }

  /* Una sola receta para las tres barras apiladas: el mismo brillo, el mismo
     sitio para el porcentaje y la misma leyenda debajo. */
  function pct1(v,tot){return Math.round(v/(tot||1)*1000)/10;}
  var OSCURO={'#EAB308':1,'#84CC16':1,'#22C55E':1,'#A1A1AA':1,'#F97316':1};
  function barraApilada(dst,leyenda,seg,tot,minTxt){
    minTxt=minTxt||6;
    document.getElementById(dst).innerHTML=seg.filter(function(s){return s.n>0;}).map(function(s){
      var p=s.n/tot*100;
      return '<div class="relative grid place-items-center overflow-hidden transition-all duration-700" '+
        'style="width:'+p+'%;background:'+s.color+'" title="'+esc(s.label)+': '+nf.format(s.n)+'">'+
        '<span class="pointer-events-none absolute inset-x-0 top-0 h-1/2 bg-gradient-to-b from-white/25 to-transparent"></span>'+
        (p>=minTxt?'<span class="relative font-mono text-[11.5px] font-medium" style="color:'+
          (OSCURO[s.color]?'#0A0A0B':'#FFFFFF')+'">'+nf.format(pct1(s.n,tot))+'%</span>':'')+
        '</div>';
    }).join('');
    document.getElementById(leyenda).innerHTML=seg.map(function(s){
      var apagado=!s.n;
      return '<span class="inline-flex items-center gap-2 text-[12.5px] '+(apagado?'text-zinc-600':'text-zinc-400')+'">'+
        '<span class="h-2.5 w-2.5 rounded-[4px]" style="background:'+s.color+';opacity:'+(apagado?.35:1)+'"></span>'+
        esc(s.label)+
        '<span class="font-mono text-[11.5px] '+(apagado?'text-zinc-700':'text-zinc-500')+'">'+
        nf.format(s.n)+' · '+nf.format(pct1(s.n,tot))+'%</span></span>';
    }).join('');
  }

  function reparto(){
    var tot=M.censo||((M.con||0)+(M.sin||0)+(M.calificadas||0))||1;
    barraApilada('x-reparto','x-reparto-leyenda',[
      {label:t('rCon'),n:M.con||0,color:'#22C55E'},
      {label:t('rNo'), n:M.sin||0,color:'#71717A'},
      {label:t('rCal'),n:M.calificadas||0,color:'#7C3AED'}
    ],tot);
  }

  function riel(){
    var cu=LIN.cuenta||{};
    document.getElementById('x-linea-tit').textContent=t('lineaTit');
    document.getElementById('x-linea-sub').textContent=t('lineaSub',{n:nf.format(LIN.total||0)});
    document.getElementById('x-linea-sello').textContent=LIN.generado?t('lineaSello',{fecha:fecha(LIN.generado)}):'';

    var par=cu.parada||0, box=document.getElementById('x-parada');
    box.hidden=!par;
    if(par) document.getElementById('x-parada-txt').textContent=
      (par===1?t('paradaTxt',{n:par}):t('paradasTxt',{n:nf.format(par)}));

    var orden=['parada'].concat(PASOS), totL=0;
    orden.forEach(function(e){totL+=(cu[e]||0);});
    barraApilada('x-linea-barra','x-linea-leyenda',orden.map(function(e){
      return {label:t('e_'+e),n:cu[e]||0,color:colorPaso(e)};
    }),totL||1,5);

    var max=Math.max.apply(null,PASOS.map(function(e){return cu[e]||0;}))||1;
    document.getElementById('x-rail').innerHTML=PASOS.map(function(e,i){
      var n=cu[e]||0, w=Math.max(3,Math.round((n/max)*100));
      return '<li><button type="button" data-paso="'+e+'"'+(n?'':' disabled')+
        ' class="w-full text-left rounded-xl border border-line/60 bg-surface p-4 transition-all duration-200 '+
        (n?'cursor-pointer hover:-translate-y-0.5 hover:border-accent/50 hover:bg-raised hover:shadow-lg hover:shadow-accent/10'
          :'cursor-default opacity-60')+'">'+
        '<div class="flex items-center gap-2">'+
        '<span class="h-1.5 w-1.5 rounded-full" style="background:'+colorPaso(e)+';opacity:'+(n?1:.3)+'"></span>'+
        '<span class="font-mono text-[10px] text-zinc-600">'+(i+1)+'</span></div>'+
        '<div class="mt-2 font-display font-semibold tracking-tight text-[22px] leading-none '+
        (n?'text-zinc-100':'text-zinc-700')+'" style="font-variant-numeric:tabular-nums">'+nf.format(n)+'</div>'+
        '<div class="mt-1.5 text-[12px] '+(n?'text-zinc-400':'text-zinc-600')+'">'+t('e_'+e)+'</div>'+
        '<div class="mt-2.5 h-0.5 w-full rounded-full bg-line/60 overflow-hidden">'+
        '<div class="h-full rounded-full transition-all duration-700" style="width:'+(n?w:0)+'%;background:'+colorPaso(e)+'"></div>'+
        '</div></button></li>';
    }).join('');
  }

  function calidad(){
    document.getElementById('x-cal-tit').textContent=t('calTit');
    var tot=M.calificadas||1;
    barraApilada('x-cal-barra','x-cal-leyenda',[1,2,3,4,5].map(function(n){
      return {label:n+'/5 '+QL[n],n:(M.q||{})[n]||0,color:QC[n]};
    }),tot,5);
  }

  function tabs(){
    var defs=[['con','tCon',M.con],['sin','tSin',M.sin],['linea','tLin',LIN.total||0],['cal','tCal',M.calificadas]];
    document.getElementById('x-tabs').innerHTML=defs.map(function(d){
      var on=d[0]===vista;
      return '<button role="tab" data-g="'+d[0]+'" aria-selected="'+on+'" '+
        'class="flex items-center gap-2 rounded-xl px-3.5 py-2 text-[13px] font-medium transition-all duration-200 '+
        (on?'bg-accent text-white shadow-md shadow-accent/20':'text-zinc-400 hover:bg-raised hover:text-zinc-100')+'">'+
        t(d[1])+'<span class="font-mono text-[11px] '+(on?'text-white/70':'text-zinc-600')+'">'+nf.format(d[2])+'</span></button>';
    }).join('');
  }

  function cabecera(){
    nf=new Intl.NumberFormat(T[L].loc);
    document.documentElement.lang=L;
    document.getElementById('x-eyebrow').textContent=t('eyebrow');
    document.getElementById('x-propuesta').textContent=t('propuesta',{fecha:fecha(M.iso)});
    document.getElementById('x-h1').textContent=t('h1');
    document.getElementById('x-tesis').textContent=t('tesis',{pend:nf.format(M.total),cal:nf.format(M.calificadas)});
    document.getElementById('x-sub').textContent=t('sub');
    document.getElementById('x-refrescar').textContent=t('btn');
    pintaAviso();
    document.getElementById('x-q').placeholder=t('buscar');
    document.getElementById('x-q').setAttribute('aria-label',t('buscar'));
    document.getElementById('x-indice-tit').textContent=t(vista==='linea'?'pasos':'artistas');
    Array.prototype.forEach.call(document.querySelectorAll('#x-langs button'),function(b){
      var on=b.dataset.l===L;
      b.className='px-2.5 py-1 rounded-lg text-[12px] font-medium transition-all duration-200 '+
        (on?'bg-accent text-white':'text-zinc-500 hover:text-zinc-200');
      b.setAttribute('aria-pressed',String(on));
    });
  }

  function todo(){
    cabecera(); cifras(); reparto(); tabs(); riel(); calidad();
    var lin=(vista==='linea');
    document.getElementById('x-linea').hidden=!lin;
    document.getElementById('x-calidad').hidden=(vista!=='cal');
    /* En Carry el índice sobra: la tira de pasos ya lleva a cada bloque. */
    document.getElementById('x-indice-caja').className=lin?'hidden':'hidden md:block';
    document.getElementById('x-rejilla').className='mt-6 grid gap-5 lg:gap-6'+
      (lin?'':' md:grid-cols-[210px_minmax(0,1fr)]');
    pinta();
  }

  /* ── eventos ── */
  document.getElementById('x-tabs').addEventListener('click',function(e){
    var b=e.target.closest('button[data-g]'); if(!b) return;
    vista=b.dataset.g; tope=40; todo();
    document.getElementById('x-lista').classList.add('fade-in');
    setTimeout(function(){document.getElementById('x-lista').classList.remove('fade-in');},420);
  });
  document.getElementById('x-langs').addEventListener('click',function(e){
    var b=e.target.closest('button[data-l]'); if(!b) return;
    L=b.dataset.l;
    try{ localStorage.setItem('covers-es-idioma',L); }catch(err){}
    todo();
  });
  /* Lo que el usuario pliega o despliega se recuerda mientras dure la visita. */
  document.getElementById('x-lista').addEventListener('toggle',function(e){
    var d=e.target; if(d.tagName==='DETAILS'&&d.dataset.clave) abierto[d.dataset.clave]=d.open;
  },true);
  var deb; document.getElementById('x-q').addEventListener('input',function(e){
    clearTimeout(deb); var v=e.target.value;
    deb=setTimeout(function(){q=v; tope=40; pinta();},120);
  });
  document.getElementById('x-idx').addEventListener('click',function(e){
    var b=e.target.closest('button[data-i]'); if(!b) return;
    lleva(document.getElementById('g'+b.dataset.i));
  });
  /* La tira de pasos lleva a su bloque de la lista, igual que el índice. */
  document.getElementById('x-rail').addEventListener('click',function(e){
    var b=e.target.closest('button[data-paso]'); if(!b||b.disabled) return;
    lleva(document.querySelector('#x-lista [data-clave="'+b.dataset.paso+'"]'));
  });
  function lleva(s){
    if(!s) return;
    if(s.tagName==='DETAILS'&&!s.open){ s.open=true; abierto[s.dataset.clave]=true; }
    s.scrollIntoView({behavior:'smooth',block:'start'});
    s.animate([{boxShadow:'0 0 0 0 rgba(124,58,237,.55)'},{boxShadow:'0 0 0 6px rgba(124,58,237,0)'}],
      {duration:800,easing:'ease-out'});
  }
  document.getElementById('x-lista').addEventListener('click',function(e){
    var b=e.target.closest('button[data-id]'); if(!b) return;
    var id=b.dataset.id;
    if(navigator.clipboard) navigator.clipboard.writeText(id).then(function(){avisa(t('copiado')+' · '+id.slice(-6));});
  });

  /* ---- Botón de actualizar a mano -------------------------------------
     El tope diario lo pone el servidor (functions/api/refrescar.js); aquí solo
     se enseña lo que queda y se sigue el progreso. Fuera del panel real no hay
     /api/estado: entonces el botón se queda en modo maqueta y no llama a nada,
     para no gastar ninguno de los intentos que comparten los usuarios. */
  var bot=document.getElementById('x-refrescar'),
      avi=document.getElementById('x-aviso'),
      caja=document.getElementById('x-progreso'),
      ptxt=document.getElementById('x-progreso-texto'),
      prel=document.getElementById('x-progreso-reloj'),
      pbar=document.getElementById('x-progreso-relleno');
  var media=600, arranque=null, fase='parado', tic=null, sonda=null, espera=0,
      ultimo=null, maqueta=false, sondeado=false;

  function mmss(sg){sg=Math.max(0,Math.round(sg));
    return Math.floor(sg/60)+':'+String(sg%60).padStart(2,'0');}
  function comoDe(sg){var m=Math.round(sg/60); return m<=1?t('unMin'):t('variosMin',{m:m});}

  function pintaAviso(){
    /* Hasta que la sonda conteste no se sabe si hay cupo: mejor callado que
       enseñar un aviso rojo que se desmiente medio segundo despues. */
    if(!sondeado){ bot.disabled=true; avi.textContent=''; return; }
    if(maqueta){ bot.disabled=false; avi.textContent=t('previa');
                 avi.className='pt-2.5 text-right text-[11.5px] leading-relaxed text-zinc-500'; return; }
    if(!ultimo||!ultimo.ok){ bot.disabled=true; avi.textContent=t('noDisp');
                 avi.className='pt-2.5 text-right text-[11.5px] leading-relaxed text-q2'; return; }
    var hay=ultimo.restantes>0;
    bot.disabled=!hay||fase!=='parado';
    avi.textContent=hay?t('quedan',{n:ultimo.restantes,t:ultimo.tope,tiempo:comoDe(media)})
                       :t('agotado',{t:ultimo.tope});
    avi.className='pt-2.5 text-right text-[11.5px] leading-relaxed '+(hay?'text-zinc-500':'text-q2');
  }
  function leerEstado(){
    return fetch('/api/estado',{cache:'no-store'}).then(function(r){
      if(!r.ok) throw 0; return r.json();
    });
  }
  function arrancarVista(k){
    caja.hidden=false; ptxt.textContent=t(k); ptxt.dataset.k=k; bot.disabled=true;
    if(tic) return;
    tic=setInterval(function(){
      var sg=arranque?(Date.now()-arranque)/1000:0;
      prel.textContent=mmss(sg)+' '+t('de')+' ~'+mmss(media);
      pbar.style.width=Math.min(97,(sg/media)*100)+'%';
    },1000);
  }
  function terminar(){
    clearInterval(tic); clearInterval(sonda); tic=null; sonda=null;
    pbar.style.width='100%';
    ptxt.textContent=t('listo'); ptxt.dataset.k='listo';
    setTimeout(function(){location.reload();},1200);
  }
  function vigilar(){
    if(sonda) return;
    sonda=setInterval(function(){
      leerEstado().then(function(d){
        if(!d||!d.ok) return;
        ultimo=d; media=d.media||media;
        if(d.corriendo){
          fase='corriendo';
          if(d.arranque) arranque=new Date(d.arranque).getTime();
          var k=ptxt.dataset.k==='enMarcha'?'enMarcha':'actualizando';
          ptxt.textContent=t(k); ptxt.dataset.k=k; return;
        }
        if(fase==='corriendo'){ terminar(); return; }
        espera+=1; if(espera>8) terminar();
      }).catch(function(){});
    },8000);
  }
  bot.addEventListener('click',function(){
    if(maqueta){ avisa(t('previaClic')); return; }
    arranque=Date.now(); fase='lanzando'; espera=0;
    arrancarVista('pidiendo');
    fetch('/api/refrescar',{method:'POST'})
      .then(function(r){return r.json();})
      .then(function(d){
        if(d&&d.ok){ ultimo=d; vigilar(); return; }
        if(d&&d.motivo==='ya-corriendo'){
          ptxt.textContent=t('yaCorriendo'); ptxt.dataset.k='yaCorriendo'; vigilar(); return;
        }
        clearInterval(tic); tic=null; caja.hidden=true; fase='parado'; bot.disabled=true;
        avi.textContent=d&&d.motivo==='tope'?t('agotado',{t:5}):t('noArranca');
        avi.className='pt-2.5 text-right text-[11.5px] leading-relaxed text-q2';
      })
      .catch(function(){
        clearInterval(tic); tic=null; caja.hidden=true; fase='parado';
        avi.textContent=t('noArranca');
        avi.className='pt-2.5 text-right text-[11.5px] leading-relaxed text-q2';
      });
  });

  todo();

  /* Una sola sonda al cargar: decide si esto es el panel real o la maqueta. */
  leerEstado().then(function(d){
    if(!d||!d.ok) throw 0;
    ultimo=d; media=d.media||media;
    sondeado=true; pintaAviso();
    if(d.corriendo){ arranque=d.arranque?new Date(d.arranque).getTime():Date.now();
                     fase='corriendo'; arrancarVista('enMarcha'); vigilar(); }
  }).catch(function(){ maqueta=true; sondeado=true; pintaAviso(); });
})();
</script>
