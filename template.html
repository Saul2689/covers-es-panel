          <ol class="mt-3 max-h-[62vh] overflow-y-auto scroll-thin pr-1" id="x-idx"></ol>
        </nav>
      </div>
      <div id="x-lista" class="min-w-0"></div>

</div>

  function t(k,v){var s=(T[L][k]||k);if(v)for(var a in v)s=s.split('{'+a+'}').join(v[a]);return s;}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function fecha(iso){
    if(!iso) return '';
    var d=new Date(iso.length<=10?iso+'T12:00:00Z':(/[Zz]$/.test(iso)?iso:iso+'Z'));

    return new Intl.DateTimeFormat(T[L].loc,{day:'numeric',month:'short'}).format(d);

    var o='<span class="inline-flex items-center gap-1.5">';
    o+='<span class="inline-flex gap-px" aria-hidden="true">';
    for(var i=1;i<=5;i++){
      o+='<span class="h-1.5 w-1.5 rounded-full" style="background:'+(i<=n?QC[n]:'#2A2A31')+'"></span>';

    o+='</span><span class="font-mono text-[11px]" style="color:'+QC[n]+'">'+n+'/5 '+t('nota'+n)+'</span></span>';
    return o;

  function chip(txt,tono,extra,sm){
    var c={ok:'border-q5/30 bg-q5/10 text-q5',
           bad:'border-q1/40 bg-q1/10 text-q1',
           warn:'border-q2/30 bg-q2/10 text-q2',
           mute:'border-line/70 bg-raised text-zinc-500',
           accent:'border-accent/30 bg-accent/10 text-accentsoft'}[tono]||'';
    /* sm = la version compacta que usa la columna de estado. Se cambia el
       tamano aqui y no con clases sueltas porque dos utilidades del mismo
       grupo (px-2 y px-1.5) se pisan en un orden que Tailwind decide. */
    var d=sm?'gap-1 rounded-md px-1.5 py-px text-[10px]':'gap-1.5 rounded-lg px-2 py-0.5 text-[11px]';
    return '<span class="inline-flex items-center border font-medium '+d+' '+
      c+' '+(extra||'')+'">'+txt+'</span>';
  }
  function idbtn(id){

      'transition-all duration-200 hover:border-accent/50 hover:text-accentsoft">'+id.slice(-6)+'</button>';
  }
  function titulo(tit,id){
    return '<a href="'+BASE+'/admin/tracks/'+id+'" target="_blank" rel="noopener" '+
      'class="font-medium text-[14.5px] text-zinc-100 transition-colors duration-200 hover:text-accentsoft">'+esc(tit)+'</a>';
  }

  /* Candado: lo echa una persona cuando da la cancion por cerrada. */
  function candado(){
    return '<svg class="h-3 w-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" '+
      'stroke-width="2.4" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"></rect>'+
      '<path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>';

  function fila(r){
    var acc='', meta='';
    /* Sin etiqueta de estado en la fila: la seccion en la que esta ya lo dice,
       y repetirlo en cada linea solo quita sitio al titulo. */
    if(vista==='cal'){
      acc=estrellas(r[3])+idbtn(r[2]);
      if(r[4]===1) meta=chip(t('archivada'),'mute');
    }else if(vista==='linea'){
      if(r[5]>0) acc+=chip(r[5]===1?t('vuelta'):t('vueltas',{n:r[5]}),'mute');
      if(r[9]) acc+=estrellas(r[9]);
      acc+=idbtn(r[2]);
      /* El candado cierra la fila, a la derecha del trackId: es lo ultimo que
         le pasa a una cancion y distingue las cerradas del todo. */
      if(r[12]) acc+=chip(candado()+t('bloqueada'),'ok');
      if(r[6]) meta='<span class="font-mono text-[11px] text-zinc-600">'+esc(fechaHora(r[6]))+'</span>';
    }else{
      var suena=r[4]===1;
      acc=chip(suena?t('suena'):(r[6]===1?t('cero'):t('karaoke')), suena?'ok':(r[6]===1?'warn':'mute'));
      acc+=idbtn(r[2]);
      if(suena) acc+='<a href="'+BASE+'/admin/api/cross-clear/migration/songs/'+r[3]+'/audio" target="_blank" rel="noopener" '+
        'class="rounded-lg border border-line/70 bg-raised px-2 py-0.5 text-[11px] font-medium text-zinc-400 '+
        'transition-all duration-200 hover:border-accent/50 hover:text-accentsoft">'+t('oir')+'</a>';
    }
    var motivo = (vista==='linea' && r[7])
      /* El motivo lo escribe el agente en español; si el parte trae ademas la
         version inglesa (indice 11) se usa esa cuando el panel esta en EN. */
      ? '<p class="mt-2 text-[12.5px] leading-relaxed max-w-[80ch]" style="color:#CDB765">'+
        esc((L==='en'&&r[11])?r[11]:r[7])+'</p>' : '';
    return '<div class="group rounded-xl border border-transparent px-3 py-2.5 transition-all duration-200 '+
      'hover:border-line/60 hover:bg-raised">'+
      '<div class="flex flex-wrap items-center gap-x-3 gap-y-2">'+
      '<div class="min-w-0 flex-1 flex flex-wrap items-center gap-x-2.5 gap-y-1">'+titulo(r[0],r[2])+meta+'</div>'+
      '<div class="flex flex-wrap items-center gap-2">'+acc+'</div></div>'+motivo+'</div>';
  }
  function fechaHora(iso){
    var d=new Date(/[Zz]$/.test(iso)?iso:iso+'Z');
    if(isNaN(d)) return '';
    return new Intl.DateTimeFormat(T[L].loc,{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}).format(d);
  }
  function colorPaso(e){
    return {parada:'#E11D48',correccion:'#F97316',revision:'#EAB308',carry:'#7C3AED',
            traduccion:'#84CC16',cola:'#A1A1AA',sinorig:'#52525B',hecha:'#22C55E'}[e]||'#52525B';
  }

  /* ── agrupar ── */
  var abierto={};
  function fuente(){return D[vista]||[];}
  function filtra(){
    var s=q.trim().toLowerCase();
    if(!s) return fuente();
    return fuente().filter(function(r){
      return (r[0]+' '+r[1]).toLowerCase().indexOf(s)>-1;
    });
  }
  function agrupa(filas){
    if(vista==='linea'){
      var orden=['parada'].concat(PASOS), bolsa={};
      orden.forEach(function(e){bolsa[e]=[];});
      filas.forEach(function(r){(bolsa[r[4]]||bolsa.cola).push(r);});
      return orden.filter(function(e){return bolsa[e].length;})
        .map(function(e){return {clave:e,nombre:t('e_'+e),color:colorPaso(e),filas:bolsa[e]};});
    }
    if(vista==='cal'){
      /* Dos bloques: calificada a secas, y calificada + bloqueada (el candado
         lo pone una persona cuando da la canción por cerrada). */
      var sol=[], amb=[];
      filas.forEach(function(r){ (r[5]?amb:sol).push(r); });
      /* De mejor a peor nota: lo bueno arriba, y dentro de cada nota por titulo. */
      var porNota=function(a,b){return (b[3]||0)-(a[3]||0) || a[0].localeCompare(b[0],'es');};
      sol.sort(porNota); amb.sort(porNota);
      return [{clave:'rate',nombre:t('gRate'),color:'#EAB308',filas:sol},
              {clave:'lock',nombre:t('gLock'),color:'#22C55E',filas:amb}]
        .filter(function(g){return g.filas.length;});
    }
    var m=new Map();
    filas.forEach(function(r){ if(!m.has(r[1])) m.set(r[1],[]); m.get(r[1]).push(r); });
    return Array.from(m.entries()).sort(function(a,b){return a[0].localeCompare(b[0],'es');})
      .map(function(p){return {clave:p[0],nombre:p[0],color:null,filas:p[1]};});
  }

  /* ── pintar ── */
  function pinta(){
    var filas=filtra(), grupos=agrupa(filas), lista=document.getElementById('x-lista');
    document.getElementById('x-cuenta').textContent=
      nf.format(filas.length)+' '+(filas.length===1?t('cancion'):t('canciones'));

    if(!grupos.length){
      lista.innerHTML='<div class="rounded-2xl bg-surface p-8 text-center text-[14px] text-zinc-500">'+t('nada')+'</div>';
      document.getElementById('x-idx').innerHTML='';
      return;
    }
    var muestra=grupos.slice(0,tope);
    /* Carry y calificadas se pliegan: son pocas secciones y muy largas. Los
       artistas no, porque son cientos de bloques de dos o tres canciones. */
    var plegable=(vista==='linea'||vista==='cal');
    lista.innerHTML=muestra.map(function(g,i){
      /* Cada sección se viste de su color: el punto, el nombre y el borde de la
         tarjeta. Los grupos por artista no tienen color y se quedan neutros. */
      var c=g.color;
      /* Interior gris y el color en el borde: marca la seccion sin apagar
         las canciones que van dentro. El nombre va en la letra de siempre y
         solo el recuento se queda en la de puntos. */
      var punto=c?'<span class="h-2 w-2 shrink-0 rounded-full" style="background:'+c+'"></span>':'';
      var cab='<span class="font-display font-semibold tracking-tight text-[15px] '+
              (c?'" style="color:'+c+'"':'text-zinc-200"')+'>'+
              esc(g.nombre)+'</span>'+
              '<span class="font-dot text-[15px] font-extrabold rounded-md px-1.5 py-px '+
              (c?'':'bg-raised text-zinc-400')+'"'+
              (c?' style="background:'+c+'26;color:'+c+'"':'')+'>'+
              nf.format(g.filas.length)+'</span>';
      var caja='class="scroll-mt-24 mb-4 rounded-2xl border-[1.2px] bg-surface p-4 sm:p-5 '+
               'shadow-xl shadow-black/40 transition-colors duration-200 '+
               (c?'"':'border-line hover:border-zinc-600"')+
               (c?' style="border-color:'+c+'"':'')+'>';
      if(!plegable)
        return '<section id="g'+i+'" data-clave="'+esc(g.clave)+'" '+caja+
          '<h3 class="mb-2 flex items-center gap-2.5 px-1">'+punto+cab+'</h3>'+
          g.filas.map(fila).join('')+'</section>';
      /* Todo arranca plegado: la página abre con el índice de secciones y
         cada una se abre a mano. Con una búsqueda en marcha se abren solas,
         que si no los resultados quedarían escondidos. */
      var abre=q?true:(abierto[g.clave]!==undefined?abierto[g.clave]:false);
      return '<details id="g'+i+'" data-clave="'+esc(g.clave)+'" '+(abre?'open ':'')+caja+
        '<summary class="-mx-1 flex cursor-pointer list-none items-center gap-2.5 rounded-xl px-1 py-1 '+
        'transition-colors duration-200 hover:bg-raised/60">'+
        '<svg class="chevron h-3.5 w-3.5 shrink-0 transition-transform duration-200" '+
        'style="color:'+(c||'#71717A')+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" '+
        'stroke-width="2.5" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>'+punto+cab+'</summary>'+
        '<div class="mt-2">'+g.filas.map(fila).join('')+'</div></details>';
    }).join('')+(grupos.length>tope
      ? '<button id="x-mas" class="w-full rounded-2xl bg-surface px-4 py-3.5 text-[13.5px] '+
        'font-medium text-zinc-400 transition-all duration-200 hover:-translate-y-0.5 hover:border-accent/50 '+
        'hover:text-white hover:shadow-lg hover:shadow-accent/10">'+t('mas',{n:nf.format(grupos.length-tope)})+'</button>'
      : '');

    var mas=document.getElementById('x-mas');
    if(mas) mas.addEventListener('click',function(){tope+=40;pinta();});

    document.getElementById('x-idx').innerHTML=muestra.map(function(g,i){
      var punto=g.color?'<span class="h-1.5 w-1.5 shrink-0 rounded-full" style="background:'+g.color+'"></span>':'';
      return '<li><button data-i="'+i+'" class="flex w-full items-center gap-2 rounded-lg px-2 py-1.5 text-left '+
        'text-[12.5px] text-zinc-400 transition-colors duration-200 hover:bg-raised hover:text-zinc-100">'+punto+
        '<span class="truncate">'+esc(g.nombre)+'</span>'+
        '<span class="ml-auto font-mono text-[11px] text-zinc-600">'+g.filas.length+'</span></button></li>';
    }).join('');
  }

  /* ── cabecera, cifras, riel ── */
  function cifras(){
    /* Cada tarjeta lleva su color como una luz que sube desde el borde de
       abajo: mismo gesto en las cuatro, solo cambia el tono y la fuerza. */
    var censo=M.censo||((M.con||0)+(M.sin||0)+(M.calificadas||0))||1;
    var c=[['kSin','kSinPie',M.total,'text-zinc-50','161,161,170',.20],
           ['kCon','kConPie',M.con,'text-q5','34,197,94',.42],
           ['kNo','kNoPie',M.sin,'text-zinc-50','161,161,170',.20],
           ['kCal','kCalPie',M.calificadas,'text-accentsoft','139,92,246',.46]];
    document.getElementById('x-cifras').innerHTML=c.map(function(x){
      return '<div class="relative overflow-hidden rounded-2xl bg-raised p-4 sm:p-5 '+
        'shadow-lg shadow-black/40">'+
        '<span class="pointer-events-none absolute inset-0" style="background:'+
        'radial-gradient(118% 82% at 50% 116%, rgba('+x[4]+','+x[5]+') 0%, rgba('+
        x[4]+','+(x[5]*.45).toFixed(3)+') 40%, rgba('+x[4]+',0) 76%)"></span>'+
        /* El porcentaje se sienta al lado de la cifra: es el mismo dato que
           antes ocupaba una grafica entera arriba. */
        '<div class="relative flex items-baseline justify-between gap-2">'+
        '<span class="font-dot font-extrabold text-[36px] leading-none '+x[3]+'">'+
        nf.format(x[2])+'</span>'+
        '<span class="font-dot text-[14px] font-extrabold leading-none rounded-lg px-2 py-1 '+
        'bg-white/[0.06] '+x[3]+'">'+nf.format(pct1(x[2],censo))+'%</span></div>'+
        '<div class="relative mt-2 text-[13px] font-medium text-zinc-200">'+t(x[0])+'</div>'+
        '<div class="relative mt-0.5 text-[12px] text-zinc-400">'+t(x[1])+'</div></div>';
    }).join('');

  /* Una sola receta para los tres repartos: una columna por dato, con su
     porcentaje encima y el nombre y el recuento debajo. La altura se mide
     contra el dato mayor, no contra el total, que si no los pequenos
     desaparecerian. */
  function pct1(v,tot){return Math.round(v/(tot||1)*1000)/10;}
  function barraApilada(dst,leyenda,seg,tot){
    var vivos=seg.filter(function(s){return s.n>0;});
    var alto=Math.max.apply(null,vivos.map(function(s){return s.n;}).concat([1]));
    document.getElementById(dst).innerHTML=vivos.map(function(s){
      /* Un suelo del 9%: en un reparto donde un paso se lleva casi todo,
         los demas seguirian siendo columnas y no rayas. */
      var h=Math.max(9,Math.round(s.n/alto*86));
      var p=pct1(s.n,tot), txt=(p===0?'<0,1':nf.format(p))+'%';
      /* Con clave la columna es un boton que baja a su bloque de la lista;
         sin clave (el reparto de notas) es solo un dato. */
      var tag=s.clave?'button':'div';
      return '<'+tag+(s.clave?' type="button" data-paso="'+esc(s.clave)+'"':'')+
        ' class="group flex min-w-0 flex-1 flex-col items-center'+
        (s.clave?' cursor-pointer transition-transform duration-200 hover:-translate-y-1':'')+
        '" title="'+esc(s.label)+': '+nf.format(s.n)+'">'+
        '<div class="flex h-[132px] w-full flex-col justify-end">'+
          '<div class="mb-1.5 text-center font-dot text-[12px] font-extrabold" style="color:'+
          s.color+'">'+txt+'</div>'+
          '<div class="mx-auto w-full max-w-[112px] shrink-0 rounded-xl transition-all duration-700'+
          (s.clave?' group-hover:brightness-125':'')+'" '+
          'style="height:'+h+'%;background:'+s.color+'"></div>'+
        '</div>'+
        '<div class="mt-2.5 font-dot text-[22px] font-extrabold leading-none text-zinc-100">'+
        nf.format(s.n)+'</div>'+
        '<div class="mt-1.5 w-full truncate text-center text-[11.5px] leading-tight text-zinc-400">'+
        esc(s.label)+'</div>'+
        '</'+tag+'>';
    }).join('');
    /* Con el nombre debajo de cada columna la leyenda ya sobra. */
    var lg=document.getElementById(leyenda);
    if(lg){lg.innerHTML=''; lg.hidden=true;}
  }

  function riel(){
    var cu=LIN.cuenta||{};
    document.getElementById('x-linea-tit').textContent=t('lineaTit');

      return {label:t('e_'+e),n:cu[e]||0,color:colorPaso(e),clave:e};
    }),totL||1,5);

  }

  /* ══════════════════════════════════════════════════════════════════════
     PESTAÑA PIPELINE — el proceso que Claude ejecuta de verdad, dibujado con
     los símbolos de diagrama de flujo de siempre.

     Las formas no son adorno: cada una quiere decir una cosa y la leyenda de
     abajo la explica. Los números salen del parte de la línea, así que el
     dibujo no se puede separar del trabajo: si mañana hay más canciones en un
     paso, mañana lo dice el dibujo.

     Columnas: a la izquierda la nota que explica el paso, en medio el tronco
     (lo que ocurre si todo va bien) y a la derecha las salidas (por dónde se
     va una canción que no sigue).
     ══════════════════════════════════════════════════════════════════════ */

   {id:'h1',f:7,t:'io',v:0,es:'cola_carry.json → GitHub → Cloudflare',en:'cola_carry.json → GitHub → Cloudflare'},

   {id:'h4',f:7,t:'ini',v:0,es:'Cover publicada',en:'Cover published'}
  ];

  /* Las flechas: [de, a, etiqueta]. Etiqueta solo donde hay decisión. */
  var FLECHAS=[
   ['a0','a1'],['a1','a2'],['a2','x1','no'],['a2','a3','si'],
   ['a3','x2','si'],['a3','a4','no'],['a4','x3','no'],['a4','a5','si'],
   ['a5','b0'],['b0','xb0','no'],['b0','b1','si'],['b1','b2'],
   ['b2','xb2','no'],['b2','b3','si'],['b3','b4'],
   ['b4','c0'],['c0','c1'],['c1','c2'],['c2','c3'],['c3','c4','si'],
   ['c4','d0'],['d0','d1'],['d1','d4','si'],['d1','d2','no'],['d2','d3'],['d3','d4'],
   ['d4','e0'],['e0','e1'],['e1','e2','si'],['e2','e3'],['e1','e3','no'],
   ['e3','f0'],['f0','f1','no'],['f1','f2'],['f2','f3'],['f3','f4'],
   ['f4','g0'],['g0','g1'],['g1','g2','dev'],['g1','x4','par'],['g1','h0','verde'],
   ['h0','h1'],['h1','h2'],['h2','h3'],['h3','h4']
  ];

  /* ── el dibujo ───────────────────────────────────────────────────────── */
  var GEO={W:1240,NX:640,NW:330,SX:1055,SW:300,AX:300,GAP:34};

  function pnum(clave){
    var P=M.proceso||{};
    if(!clave) return null;
    if(clave==='total') return P.total||0;
    if(clave==='descartadas') return P.descartadas||0;
    if(clave.indexOf('e_')===0) return (P.estados||{})[clave.slice(2)]||0;
    if(clave==='p_timing_saul') return ((P.pasos||{}).timing||{}).saul||0;
    if(clave.indexOf('p_')===0) return ((P.pasos||{})[clave.slice(2)]||{}).ok||0;
    return null;
  }

  /* Parte un texto en renglones de como mucho `max` caracteres. */
  function renglones(txt,max){
    var out=[],linea='';
    txt.split(' ').forEach(function(p){
      if(linea && (linea+' '+p).length>max){out.push(linea);linea=p;}
      else linea=linea?linea+' '+p:p;
    });
    if(linea) out.push(linea);
    return out;
  }

  function alto(t,lineas){
    if(t==='dec') return Math.max(96,44+lineas*20);
    return Math.max(58,30+lineas*20);
  }

  /* Cada forma es un <path> o un <rect>: son las del diagrama de flujo de
     toda la vida, no inventos. */
  function silueta(t,x,y,w,h,col){
    var l=x-w/2,r=x+w/2,a=y-h/2,b=y+h/2,e='fill="'+col.bg+'" stroke="'+col.bd+'" stroke-width="1.6"';
    if(t==='ini'||t==='esp')
      return '<rect x="'+l+'" y="'+a+'" width="'+w+'" height="'+h+'" rx="'+(h/2)+'" '+e+'/>';
    if(t==='dec')
      return '<path d="M '+x+' '+a+' L '+r+' '+y+' L '+x+' '+b+' L '+l+' '+y+' Z" '+e+'/>';
    if(t==='io')
      return '<path d="M '+(l+18)+' '+a+' H '+r+' L '+(r-18)+' '+b+' H '+l+' Z" '+e+'/>';
    if(t==='man')
      return '<path d="M '+l+' '+a+' H '+r+' L '+(r-20)+' '+b+' H '+(l+20)+' Z" '+e+'/>';
    if(t==='db')
      return '<path d="M '+l+' '+(a+9)+' a '+(w/2)+' 9 0 0 1 '+w+' 0 v '+(h-18)+
             ' a '+(w/2)+' 9 0 0 1 -'+w+' 0 Z" '+e+'/>'+
             '<path d="M '+l+' '+(a+9)+' a '+(w/2)+' 9 0 0 0 '+w+' 0" fill="none" stroke="'+col.bd+'" stroke-width="1.2"/>';
    if(t==='doc')
      return '<path d="M '+l+' '+a+' H '+r+' V '+(b-10)+' q -'+(w/4)+' 14 -'+(w/2)+' 0 q -'+(w/4)+' -14 -'+(w/2)+' 0 Z" '+e+'/>';
    if(t==='con')
      return '<rect x="'+l+'" y="'+a+'" width="'+w+'" height="'+h+'" rx="'+(h/2)+'" '+e+' stroke-dasharray="6 5"/>';
    if(t==='sub')
      return '<rect x="'+l+'" y="'+a+'" width="'+w+'" height="'+h+'" rx="6" '+e+'/>'+
             '<line x1="'+(l+11)+'" y1="'+a+'" x2="'+(l+11)+'" y2="'+b+'" stroke="'+col.bd+'" stroke-width="1.4"/>'+
             '<line x1="'+(r-11)+'" y1="'+a+'" x2="'+(r-11)+'" y2="'+b+'" stroke="'+col.bd+'" stroke-width="1.4"/>';
    return '<rect x="'+l+'" y="'+a+'" width="'+w+'" height="'+h+'" rx="8" '+e+'/>';
  }

  var COLORES={
    ini:{bg:'#1F2430',bd:'#64748B'},   proc:{bg:'#1B1B21',bd:'#3F3F49'},
    dec:{bg:'#241C33',bd:'#7C3AED'},   sub:{bg:'#18211F',bd:'#2F6F5E'},
    io:{bg:'#1A1F27',bd:'#4B6A86'},    db:{bg:'#1F1D18',bd:'#8A7442'},
    doc:{bg:'#1F1D18',bd:'#8A7442'},   man:{bg:'#2A1C1C',bd:'#B45309'},
    esp:{bg:'#2A1C1C',bd:'#B45309'},   con:{bg:'#1B1B21',bd:'#7C3AED'}
  };
  var ETIQ={si:['Sí','Yes'],no:['No','No'],dev:['Devuelto','Returned'],
            par:['Parada','Stopped'],verde:['Verde','Green']};

  function diagrama(){
    var P=M.proceso||{},pos={},y=24,partes=[],flechas=[],bandas={},tronco=[],fant=-1;
    /* 1. Sitio para cada caja del tronco, en orden. Cada fase abre con su
       cabecera, y las cajas empiezan por debajo para que el titulo de la fase
       no se cruce con la nota de la primera caja. */
    NODOS.forEach(function(nd){
      if(nd.v) return;
      if(nd.f!==fant){ if(fant>=0) y+=22; bandas[nd.f]={a:y,b:0}; y+=58; fant=nd.f; }
      var txt=nd[L]||nd.es, ln=renglones(txt,nd.t==='dec'?26:32), h=alto(nd.t,ln.length);
      pos[nd.id]={x:GEO.NX,y:y+h/2,w:GEO.NW,h:h,ln:ln,nd:nd,i:tronco.length};
      tronco.push(nd.id);
      bandas[nd.f].b=y+h+18; y+=h+GEO.GAP;
    });
    /* 2. Las salidas cuelgan del nodo que las produce. Si dos salen del mismo
       sitio, la segunda baja: dos cajas en la misma linea no se leen. */
    var origen={},usados=[];
    FLECHAS.forEach(function(fl){ if(!pos[fl[1]]&&!origen[fl[1]]) origen[fl[1]]=fl[0]; });
    NODOS.forEach(function(nd){
      if(!nd.v) return;
      var p=pos[origen[nd.id]]||{y:60};
      var txt=nd[L]||nd.es, ln=renglones(txt,30), h=alto(nd.t,ln.length), yy=p.y;
      while(usados.some(function(u){return Math.abs(u-yy)<h+26;})) yy+=h+30;
      usados.push(yy);
      pos[nd.id]={x:GEO.SX,y:yy,w:GEO.SW,h:h,ln:ln,nd:nd};
    });
    /* 3. Las bandas de fase, detrás de todo. */
    FASES.forEach(function(f){
      var b=bandas[f[0]]; if(!b) return;
      partes.push('<rect x="8" y="'+b.a+'" width="'+(GEO.W-16)+'" height="'+(b.b-b.a)+
        '" rx="16" fill="#17171C" stroke="#25252C" stroke-width="1"/>'+
        '<text x="26" y="'+(b.a+24)+'" fill="#A78BFA" font-size="13" font-weight="700" '+
        'letter-spacing="0.04em">'+esc(L==='en'?f[3]:f[1])+'</text>'+
        '<text x="26" y="'+(b.a+42)+'" fill="#71717A" font-size="12">'+
        esc(L==='en'?f[4]:f[2])+'</text>');
    });
    /* 4. Las flechas, antes que las cajas para que no las tapen. */
    var rotulo={};
    FLECHAS.forEach(function(fl){
      var a=pos[fl[0]],b=pos[fl[1]]; if(!a||!b) return;
      var d,mx,ex,ey,salto=(a.x===b.x&&Math.abs((a.i||0)-(b.i||0))>1);
      if(a.x===b.x&&!salto){
        d='M '+a.x+' '+(a.y+a.h/2)+' V '+(b.y-b.h/2-7);
        ex=a.x+13; ey=a.y+a.h/2+16;
      }else if(salto){
        /* Un ramal que se salta cajas no las atraviesa: sale por la derecha,
           baja por fuera y vuelve a entrar. */
        mx=a.x+a.w/2+56;
        d='M '+(a.x+a.w/2)+' '+a.y+' H '+mx+' V '+b.y+' H '+(b.x+b.w/2+7);
        ex=mx+8; ey=a.y-8;
      }else{
        mx=a.x+a.w/2+24;
        d='M '+(a.x+a.w/2)+' '+a.y+' H '+mx+' V '+b.y+' H '+(b.x-b.w/2-7);
        ex=mx+8; ey=a.y-8;
      }
      flechas.push('<path d="'+d+'" fill="none" stroke="#52525B" stroke-width="1.5" '+
                   'marker-end="url(#pf)"/>');
      if(fl[2]){
        /* De una decision salen dos o tres ramales por el mismo lado: sus
           rotulos se escalonan para que no caigan uno encima de otro. */
        var k=fl[0]+'|'+(a.x===b.x&&!salto?'v':'h');
        rotulo[k]=(rotulo[k]||0)+1;
        flechas.push('<text x="'+ex+'" y="'+(ey+(rotulo[k]-1)*16)+'" fill="#A1A1AA" '+
          'font-size="11.5" font-weight="700">'+esc(ETIQ[fl[2]][L==='en'?1:0])+'</text>');
      }
    });
    /* 5. Las cajas, su número y su nota. */
    NODOS.forEach(function(nd){
      var p=pos[nd.id]; if(!p) return;
      var c=COLORES[nd.t],col=nd.r?{bg:'#2E1414',bd:'#EF4444'}:c;
      var g=['<g>'];
      g.push(silueta(nd.t,p.x,p.y,p.w,p.h,col));
      var y0=p.y-(p.ln.length-1)*10;
      p.ln.forEach(function(t,i){
        g.push('<text x="'+p.x+'" y="'+(y0+i*20+5)+'" text-anchor="middle" fill="#E4E4E7" '+
               'font-size="13.5" font-weight="600">'+esc(t)+'</text>');
      });
      var n=pnum(nd.n);
      if(n!==null){
        var bx=p.x+p.w/2-4;
        g.push('<rect x="'+(bx-52)+'" y="'+(p.y-p.h/2-11)+'" width="56" height="22" rx="11" '+
               'fill="'+col.bd+'" fill-opacity="0.22" stroke="'+col.bd+'" stroke-width="1"/>');
        g.push('<text x="'+(bx-24)+'" y="'+(p.y-p.h/2+4)+'" text-anchor="middle" '+
               'fill="#FAFAFA" font-size="12.5" font-weight="800" '+
               'font-family="Doto, monospace">'+nf.format(n)+'</text>');
      }
      var nota=L==='en'?(nd.ne||nd.ns):(nd.ns||nd.ne);
      if(nota&&!nd.v){
        var nl=renglones(nota,40);
        nl.forEach(function(t,i){
          g.push('<text x="'+GEO.AX+'" y="'+(p.y-(nl.length-1)*7.5+i*15+4)+'" text-anchor="end" '+
                 'fill="'+(nd.r?'#FCA5A5':'#71717A')+'" font-size="11.5">'+esc(t)+'</text>');
        });
        g.push('<line x1="'+(GEO.AX+10)+'" y1="'+p.y+'" x2="'+(p.x-p.w/2-6)+'" y2="'+p.y+
               '" stroke="#2A2A31" stroke-width="1" stroke-dasharray="3 4"/>');
      }
      if(nota&&nd.v){
        var nr=renglones(nota,36);
        nr.forEach(function(t,i){
          g.push('<text x="'+(p.x-p.w/2)+'" y="'+(p.y+p.h/2+16+i*15)+'" fill="#71717A" '+
                 'font-size="11.5">'+esc(t)+'</text>');
        });
      }
      g.push('</g>');
      partes.push(g.join(''));
    });
    var alt=y+70;
    return '<svg viewBox="0 0 '+GEO.W+' '+alt+'" width="100%" style="min-width:980px" '+
      'role="img" aria-label="'+esc(t('procAria'))+'">'+
      '<defs><marker id="pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" '+
      'markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52525B"/></marker></defs>'+
      partes.slice(0,FASES.length).join('')+flechas.join('')+
      partes.slice(FASES.length).join('')+'</svg>';
  }

  function leyenda(){
    return FORMAS.map(function(f){
      var c=COLORES[f[0]];
      return '<div class="flex items-start gap-3 rounded-xl border border-line bg-raised/40 p-3">'+
        '<svg width="76" height="42" viewBox="0 0 76 42" class="shrink-0">'+
        silueta(f[0],38,21,64,30,c)+'</svg>'+
        '<div class="min-w-0"><p class="text-[13px] font-semibold text-zinc-200">'+
        esc(L==='en'?f[3]:f[1])+'</p>'+
        '<p class="mt-0.5 text-[12px] leading-snug text-zinc-500">'+
        esc(L==='en'?f[4]:f[2])+'</p></div></div>';
    }).join('');
  }

  function marcador(){
    var P=M.proceso||{},E=P.estados||{},S=P.pasos||{};
    var cifras=[
      ['procEnCola',P.total||0],
      ['procTrab',P.trabajadas||0],
      ['procHechas',E.hecha||0],
      ['procVuelo',(E.carry||0)+(E.correccion||0)+(E.revision||0)+(E.traduccion||0)],
      ['procParadas',E.parada||0],
      ['procDevueltas',P.devueltas||0]
    ];
    var caja=cifras.map(function(c){
      return '<div class="rounded-xl border border-line bg-raised/40 px-3.5 py-2.5">'+
        '<p class="font-dot text-[19px] font-extrabold leading-none text-zinc-100">'+
        nf.format(c[1])+'</p><p class="mt-1 text-[11.5px] text-zinc-500">'+esc(t(c[0]))+'</p></div>';
    }).join('');
    var pasos=['carry','lrc','timing','mapeo','ingles','qc'].map(function(p){
      var d=S[p]||{},ok=d.ok||0,mal=(d.falta||0)+(d.saul||0),tot=ok+mal+(d.na||0);
      var pc=tot?Math.round(ok*100/tot):0;
      return '<div class="min-w-0"><div class="flex items-baseline justify-between gap-2">'+
        '<span class="text-[12px] text-zinc-400">'+esc(t('paso_'+p))+'</span>'+
        '<span class="font-dot text-[12px] font-bold text-zinc-300">'+nf.format(ok)+
        (mal?'<span class="text-q2"> / '+nf.format(mal)+'</span>':'')+'</span></div>'+
        '<div class="mt-1 h-1.5 rounded-full bg-raised overflow-hidden">'+
        '<div class="h-full rounded-full bg-accent" style="width:'+pc+'%"></div></div></div>';
    }).join('');
    return '<div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-2.5">'+caja+'</div>'+
      '<div class="mt-5"><h3 class="font-mono text-[10.5px] uppercase tracking-[0.12em] text-zinc-500">'+
      esc(t('procPasos'))+'</h3>'+
      '<p class="mt-1 text-[12.5px] text-zinc-500 max-w-[70ch]">'+esc(t('procPasosSub'))+'</p>'+
      '<div class="mt-3 grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-x-5 gap-y-3">'+pasos+'</div></div>';
  }

  function proceso(){
    if(vista!=='proc') return;
    document.getElementById('x-proc-tit').textContent=t('procTit');
    document.getElementById('x-proc-sub').textContent=t('procSub');
    document.getElementById('x-proc-marcador').innerHTML=marcador();
    document.getElementById('x-proc-svg').innerHTML=diagrama();
    document.getElementById('x-proc-ley-tit').textContent=t('procLey');
    document.getElementById('x-proc-ley-sub').textContent=t('procLeySub');
    document.getElementById('x-proc-leyenda').innerHTML=leyenda();
    document.getElementById('x-proc-pie').textContent=t('procPie');
  }

  function todo(){
    cabecera(); cifras(); tabs(); riel(); calidad(); proceso();
    var lin=(vista==='linea'), pro=(vista==='proc');
    document.getElementById('x-linea').hidden=!lin;
    document.getElementById('x-calidad').hidden=(vista!=='cal');
    document.getElementById('x-proceso').hidden=!pro;
    /* La pestaña del proceso no es una lista de canciones: el buscador y la
       rejilla no pintan nada ahí. */
    document.getElementById('x-rejilla').hidden=pro;
    /* El indice sobra donde ya hay otra forma de llegar: en Carry lo hacen
       las columnas y en calificadas solo hay dos bloques. */
    var sinIndice=lin||pro||vista==='cal';
    document.getElementById('x-indice-caja').className=sinIndice?'hidden':'hidden md:block';
    document.getElementById('x-rejilla').className='mt-6 grid gap-5 lg:gap-6'+
      (sinIndice?'':' md:grid-cols-[210px_minmax(0,1fr)]');
    pinta();
  }

  /* ── eventos ── */
  document.getElementById('x-tabs').addEventListener('click',function(e){
    var b=e.target.closest('button[data-g]'); if(!b) return;
    vista=b.dataset.g; tope=40; todo();
    document.getElementById('x-lista').classList.add('fade-in');
    setTimeout(function(){document.getElementById('x-lista').classList.remove('fade-in');},420);
  });
  document.getElementById('x-langs').addEventListener('click',function(e){
    var b=e.target.closest('button[data-l]'); if(!b) return;
    L=b.dataset.l; todo();
  });
  /* Lo que el usuario pliega o despliega se recuerda mientras dure la visita. */
  document.getElementById('x-lista').addEventListener('toggle',function(e){
    var d=e.target; if(d.tagName==='DETAILS'&&d.dataset.clave) abierto[d.dataset.clave]=d.open;
  },true);
  var deb; document.getElementById('x-q').addEventListener('input',function(e){
    clearTimeout(deb); var v=e.target.value;
    deb=setTimeout(function(){q=v; tope=40; pinta();},120);
  });
  document.getElementById('x-idx').addEventListener('click',function(e){
    var b=e.target.closest('button[data-i]'); if(!b) return;
    lleva(document.getElementById('g'+b.dataset.i));
  });
  /* Cada columna lleva a su bloque de la lista, igual que el índice. */
  document.getElementById('x-linea-barra').addEventListener('click',function(e){
    var b=e.target.closest('button[data-paso]'); if(!b) return;
    lleva(document.querySelector('#x-lista [data-clave="'+b.dataset.paso+'"]'));
  });
  function lleva(s){
    if(!s) return;
    if(s.tagName==='DETAILS'&&!s.open){ s.open=true; abierto[s.dataset.clave]=true; }
    s.scrollIntoView({behavior:'smooth',block:'start'});
    s.animate([{boxShadow:'0 0 0 0 rgba(124,58,237,.55)'},{boxShadow:'0 0 0 6px rgba(124,58,237,0)'}],
      {duration:800,easing:'ease-out'});
  }
  document.getElementById('x-lista').addEventListener('click',function(e){
    var b=e.target.closest('button[data-id]'); if(!b) return;
    var id=b.dataset.id;
    if(navigator.clipboard) navigator.clipboard.writeText(id).then(function(){avisa(t('copiado')+' · '+id.slice(-6));});
  });

  /* ---- Botón de actualizar a mano -------------------------------------
     El tope diario lo pone el servidor (functions/api/refrescar.js); aquí solo
     se enseña lo que queda y se sigue el progreso. Fuera del panel real no hay
     /api/estado: entonces el botón se queda en modo maqueta y no llama a nada,
     para no gastar ninguno de los intentos que comparten los usuarios. */
  var bot=document.getElementById('x-refrescar'),
      avi=document.getElementById('x-aviso'),
      caja=document.getElementById('x-progreso'),
      ptxt=document.getElementById('x-progreso-texto'),
      prel=document.getElementById('x-progreso-reloj'),
      pbar=document.getElementById('x-progreso-relleno');
  var media=600, arranque=null, fase='parado', tic=null, sonda=null, espera=0,
      ultimo=null, maqueta=false, sondeado=false;

  function mmss(sg){sg=Math.max(0,Math.round(sg));
    return Math.floor(sg/60)+':'+String(sg%60).padStart(2,'0');}
  function comoDe(sg){var m=Math.round(sg/60); return m<=1?t('unMin'):t('variosMin',{m:m});}

  function pintaAviso(){
    /* Hasta que la sonda conteste no se sabe si hay cupo: mejor callado que
       enseñar un aviso rojo que se desmiente medio segundo despues. */
    if(!sondeado){ bot.disabled=true; avi.textContent=''; return; }
    if(maqueta){ bot.disabled=false; avi.textContent=t('previa');
                 avi.className='pt-2.5 text-right text-[11.5px] leading-relaxed text-zinc-500'; return; }
    if(!ultimo||!ultimo.ok){ bot.disabled=true; avi.textContent=t('noDisp');
                 avi.className='pt-2.5 text-right text-[11.5px] leading-relaxed text-q2'; return; }
    var hay=ultimo.restantes>0;
    bot.disabled=!hay||fase!=='parado';
    avi.textContent=hay?t('quedan',{n:ultimo.restantes,t:ultimo.tope,tiempo:comoDe(media)})
                       :t('agotado',{t:ultimo.tope});
    avi.className='pt-2.5 text-right text-[11.5px] leading-relaxed '+(hay?'text-zinc-500':'text-q2');
  }
  function leerEstado(){
    return fetch('/api/estado',{cache:'no-store'}).then(function(r){
      if(!r.ok) throw 0; return r.json();
    });
  }
  function arrancarVista(k){
    caja.hidden=false; ptxt.textContent=t(k); ptxt.dataset.k=k; bot.disabled=true;
    if(tic) return;
    tic=setInterval(function(){
      var sg=arranque?(Date.now()-arranque)/1000:0;
      prel.textContent=mmss(sg)+' '+t('de')+' ~'+mmss(media);
      pbar.style.width=Math.min(97,(sg/media)*100)+'%';
    },1000);
  }
  function terminar(){
    clearInterval(tic); clearInterval(sonda); tic=null; sonda=null;
    pbar.style.width='100%';
    ptxt.textContent=t('listo'); ptxt.dataset.k='listo';
    setTimeout(function(){location.reload();},1200);
  }
  function vigilar(){
    if(sonda) return;
    sonda=setInterval(function(){
      leerEstado().then(function(d){
        if(!d||!d.ok) return;
        ultimo=d; media=d.media||media;
        if(d.corriendo){
          fase='corriendo';
          if(d.arranque) arranque=new Date(d.arranque).getTime();
          var k=ptxt.dataset.k==='enMarcha'?'enMarcha':'actualizando';
          ptxt.textContent=t(k); ptxt.dataset.k=k; return;
        }
        if(fase==='corriendo'){ terminar(); return; }
        espera+=1; if(espera>8) terminar();
      }).catch(function(){});
    },8000);
  }
  bot.addEventListener('click',function(){
    if(maqueta){ avisa(t('previaClic')); return; }
    arranque=Date.now(); fase='lanzando'; espera=0;
    arrancarVista('pidiendo');
    fetch('/api/refrescar',{method:'POST'})
      .then(function(r){return r.json();})
      .then(function(d){
        if(d&&d.ok){ ultimo=d; vigilar(); return; }
        if(d&&d.motivo==='ya-corriendo'){
          ptxt.textContent=t('yaCorriendo'); ptxt.dataset.k='yaCorriendo'; vigilar(); return;
        }
        clearInterval(tic); tic=null; caja.hidden=true; fase='parado'; bot.disabled=true;
        avi.textContent=d&&d.motivo==='tope'?t('agotado',{t:5}):t('noArranca');
        avi.className='pt-2.5 text-right text-[11.5px] leading-relaxed text-q2';
      })
      .catch(function(){
        clearInterval(tic); tic=null; caja.hidden=true; fase='parado';
        avi.textContent=t('noArranca');
        avi.className='pt-2.5 text-right text-[11.5px] leading-relaxed text-q2';
      });
  });

  todo();

  /* Una sola sonda al cargar: decide si esto es el panel real o la maqueta. */
  leerEstado().then(function(d){
    if(!d||!d.ok) throw 0;
    ultimo=d; media=d.media||media;
    sondeado=true; pintaAviso();
    if(d.corriendo){ arranque=d.arranque?new Date(d.arranque).getTime():Date.now();
                     fase='corriendo'; arrancarVista('enMarcha'); vigilar(); }
  }).catch(function(){ maqueta=true; sondeado=true; pintaAviso(); });
})();
</script>
