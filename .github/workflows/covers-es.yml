# Secrets necesarios en el repo:
#   SINGIT_PROD_TOKEN     el admin_token de la cookie
#   CLOUDFLARE_API_TOKEN  token de Cloudflare con permiso "Cloudflare Pages: Edit"
#   CLOUDFLARE_ACCOUNT_ID id de la cuenta
#   SLACK_WEBHOOK_URL     webhook de Slack para el aviso (opcional)
#   PANEL_PASS            la contrasena con la que se entra al panel
name: Panel covers es

# El nombre de cada vuelta dice de donde salio. Es lo que mira el contador del
# boton para no cobrarse las que lanzamos desde la terminal.
run-name: Panel covers es · ${{ inputs.origen || github.event_name }}

# Sin cron: el planificador de GitHub no despierta este proceso a su hora (una
# vuelta de las doce que tocaban entre el 16 y el 17 de septiembre de 2026), asi
# que el reloj se mudo a Cloudflare -> reloj/, que llama aqui con origen=reloj.
on:
  workflow_dispatch:
    inputs:
      origen:
        description: 'quien la pide'
        required: false
        default: terminal
        type: choice
        options: [terminal, boton, reloj]

concurrency:
  group: covers-es
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GANCHO: ${{ secrets.SLACK_WEBHOOK_URL }}
      CLAVE: ${{ secrets.PANEL_PASS }}
      PASE: ${{ secrets.GH_TOKEN }}
      ORIGEN: ${{ inputs.origen || 'terminal' }}
      ENLACE: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Mirar la hora en Madrid
        id: horario
        run: |
          H=$(TZ=Europe/Madrid date +%H)
          H=$((10#$H))
          echo "En Madrid son las $H h. Origen: $ORIGEN."
          if [ "$ORIGEN" != "reloj" ]; then
            echo "Pedida por una persona: se actualiza a la hora que sea."
            echo "toca=si" >> "$GITHUB_OUTPUT"
          elif [ "$H" -ge 9 ] && [ "$H" -le 18 ]; then
            echo "toca=si" >> "$GITHUB_OUTPUT"
          else
            echo "Fuera de la franja 9-18: no se actualiza."
            echo "toca=no" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.horario.outputs.toca == 'si'

      - uses: actions/setup-python@v5
        if: steps.horario.outputs.toca == 'si'
        with:
          python-version: '3.12'

      - name: Regenerar el panel
        if: steps.horario.outputs.toca == 'si'
        env:
          SINGIT_PROD_BASE: https://api.singit.io
          SINGIT_PROD_TOKEN: ${{ secrets.SINGIT_PROD_TOKEN }}
          PANEL_PASS: ${{ secrets.PANEL_PASS }}
        run: python refresh.py --out dist

      # La puerta del panel (functions/_middleware.js) lee PANEL_PASS del
      # proyecto de Pages, no del repo: el repo es publico. Esto la deja
      # puesta en cada vuelta, que es de balde y asi no se pierde nunca. Si
      # falla no se tumba la vuelta: antes un panel abierto que un panel viejo.
      - name: Dejar puesta la contrasena del panel
        if: steps.horario.outputs.toca == 'si' && env.CLAVE != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        continue-on-error: true
        run: |
          printf '%s' "$CLAVE" | npx --yes wrangler@3 pages secret put PANEL_PASS             --project-name covers-es-v2

      # El boton de actualizar a mano lanza esta misma accion desde la pagina,
      # y para eso la funcion de Cloudflare necesita un pase de GitHub. Caduca
      # cada pocos meses y nadie se entera hasta que el boton deja de ir, asi
      # que se vuelve a dejar puesto en cada vuelta, igual que la contrasena.
      - name: Dejar puesto el pase del boton
        if: steps.horario.outputs.toca == 'si' && env.PASE != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        continue-on-error: true
        run: |
          printf '%s' "$PASE" | npx --yes wrangler@3 pages secret put GH_TOKEN --project-name covers-es-v2

      - name: Publicar en Cloudflare Pages
        if: steps.horario.outputs.toca == 'si'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name covers-es-v2 --branch main

      - name: Avisar por Slack
        if: steps.horario.outputs.toca == 'si' && env.GANCHO != ''
        run: python aviso_slack.py

      - name: Avisar por Slack de un fallo
        if: failure() && steps.horario.outputs.toca == 'si' && env.GANCHO != ''
        env:
          FALLO: '1'
        run: python aviso_slack.py
