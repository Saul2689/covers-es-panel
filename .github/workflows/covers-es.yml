# Secrets necesarios en el repo:
#   SINGIT_PROD_TOKEN     el admin_token de la cookie
#   CLOUDFLARE_API_TOKEN  token de Cloudflare con permiso "Cloudflare Pages: Edit"
#   CLOUDFLARE_ACCOUNT_ID id de la cuenta
name: Panel covers es

on:
  schedule:
    # La franja ancha cubre 09:00-18:00 de Madrid tanto en verano (UTC+2)
    # como en invierno (UTC+1); el paso "horario" recorta lo que sobra.
    - cron: '0 7-17 * * *'
  workflow_dispatch:       # y a mano desde la pestana Actions

concurrency:
  group: covers-es
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Mirar la hora en Madrid
        id: horario
        run: |
          H=$(TZ=Europe/Madrid date +%H)
          H=$((10#$H))
          echo "En Madrid son las $H h."
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Lanzado a mano: se actualiza igual."
            echo "toca=si" >> "$GITHUB_OUTPUT"
          elif [ "$H" -ge 9 ] && [ "$H" -le 18 ]; then
            echo "toca=si" >> "$GITHUB_OUTPUT"
          else
            echo "Fuera de la franja 9-18: no se actualiza."
            echo "toca=no" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.horario.outputs.toca == 'si'

      - uses: actions/setup-python@v5
        if: steps.horario.outputs.toca == 'si'
        with:
          python-version: '3.12'

      - name: Regenerar el panel
        if: steps.horario.outputs.toca == 'si'
        env:
          SINGIT_PROD_BASE: https://api.singit.io
          SINGIT_PROD_TOKEN: ${{ secrets.SINGIT_PROD_TOKEN }}
        run: python refresh.py --out dist

      - name: Publicar en Cloudflare Pages
        if: steps.horario.outputs.toca == 'si'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name covers-es-v2 --branch main
